<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Psss 🤫</title></head><body><section id="auth" class="screen center"><div class="card"><h1>Psss 🤫</h1><p>Was im Chat bleibt, bleibt im Chat.</p><div class="tabs"><button data-tab="login" class="active">Anmelden</button><button data-tab="register">Registrieren</button></div><form id="loginForm"><input id="loginName" placeholder="Benutzername" required><input id="loginPin" type="password" inputmode="numeric" placeholder="PIN" required><button>Anmelden</button></form><form id="registerForm" class="hidden"><input id="registerName" placeholder="Benutzername" required><input id="registerPin" type="password" inputmode="numeric" placeholder="PIN (4–8 Zahlen)" required><input id="invite" value="PSSS-2026" placeholder="Einladungscode" required><button>Konto erstellen</button></form><p id="msg"></p><small>Testcode: PSSS-2026</small></div></section><section id="main" class="screen hidden"><header><button id="menu">☰</button><b>Psss 🤫</b><span id="who"></span><button id="theme">◐</button></header><div class="layout"><aside id="side"><div class="row"><h2>Chats</h2><button id="add">+ Freund</button></div><input id="search" placeholder="Suchen …"><div id="friends"></div><button id="install" class="hidden">App installieren</button><button id="logout" class="danger">Abmelden</button></aside><main><div id="empty" class="empty"><div>🤫</div><h2>Wähle einen Chat</h2></div><div id="chat" class="chat hidden"><div class="chathead"><span id="avatar"></span><div><b id="chatName"></b><small id="status"></small></div></div><div id="messages"></div><form id="send"><input id="text" placeholder="Nachricht schreiben …" maxlength="500"><button>➤</button></form></div></main></div></section><dialog id="dlg"><form method="dialog"><h2>Freund hinzufügen</h2><input id="friendName" placeholder="Benutzername" required><select id="friendStatus"><option>online</option><option>offline</option><option>beschäftigt</option></select><div class="row"><button value="cancel">Abbrechen</button><button id="save" value="default">Hinzufügen</button></div></form></dialog><script src="app.js"></script></body></html>
