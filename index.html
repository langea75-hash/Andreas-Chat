<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>Psss 🤫 0.3</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body>
<section id="auth" class="center"><div class="card"><h1>Psss 🤫</h1><p>Privater Messenger nur per Einladung.</p><div class="tabs"><button data-tab="login" class="tab active">Anmelden</button><button data-tab="register" class="tab">Registrieren</button></div>
<form id="loginForm"><label>Benutzername<input id="loginUser" required></label><label>PIN<input id="loginPin" type="password" inputmode="numeric" minlength="4" maxlength="8" required></label><button>Anmelden</button></form>
<form id="registerForm" class="hidden"><label>Dein Name<input id="displayName" required></label><label>Benutzername<input id="registerUser" required></label><label>PIN<input id="registerPin" type="password" inputmode="numeric" minlength="4" maxlength="8" required></label><label>Einladungscode<input id="masterInvite" value="PSSS-2026" required></label><button>Registrieren</button></form><p id="authMsg" class="msg"></p></div></section>
<section id="app" class="hidden"><header><button id="menu">☰</button><strong>Psss 🤫</strong><span id="me"></span><button id="theme">◐</button></header><div class="layout"><aside id="side"><div class="sidehead"><h2>Chats</h2><button id="inviteBtn">+ Einladung</button></div><div class="invitebox"><small>Dein Einladungscode</small><div><code id="myInvite"></code><button id="copyInvite">Kopieren</button></div></div><div id="chatList"></div><button id="logout" class="logout">Abmelden</button></aside><main><div id="empty" class="empty">🤫<h2>Wähle einen Chat</h2></div><section id="chat" class="chat hidden"><div class="chathead"><div class="avatar" id="avatar">A</div><div><b id="chatName"></b><small>online verbunden</small></div></div><div id="messages"></div><form id="sendForm"><input id="text" maxlength="800" placeholder="Nachricht schreiben …" autocomplete="off"><button>➤</button></form></section></main></div></section>
<dialog id="inviteDialog"><form method="dialog" id="inviteForm"><h2>Freund hinzufügen</h2><p>Gib den persönlichen Einladungscode deines Freundes ein.</p><input id="friendCode" placeholder="z. B. PSSS-AB12CD" required><p id="inviteMsg" class="msg"></p><div><button value="cancel" type="button" id="cancelInvite" class="secondary">Abbrechen</button><button type="submit">Hinzufügen</button></div></form></dialog>
<script type="module" src="app.js"></script></body></html>
